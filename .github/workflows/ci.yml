name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only checks out the PR tree and runs tests.
permissions:
  contents: read

jobs:
  harvest-rest:
    name: harvest-rest unit tests + public-safe scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servers/harvest-rest/package-lock.json

      - name: Install
        working-directory: servers/harvest-rest
        run: npm ci

      - name: Typecheck
        working-directory: servers/harvest-rest
        run: npm run typecheck

      - name: Unit tests
        working-directory: servers/harvest-rest
        env:
          # Never enable send paths in CI. Live invoice email is Mike-GO only.
          DANGEROUS_SEND: ""
        run: |
          mapfile -t files < <(find test -name '*.test.ts' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no test files found under test/"
            exit 1
          fi
          node --import tsx --test "${files[@]}"

      - name: Public-safe scan (no committed secrets)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          mcp = json.loads(Path("mcp.json").read_text())
          blob = json.dumps(mcp)
          if "HARVEST_ACCESS_TOKEN" in blob or "access_token" in blob.lower():
              raise SystemExit("mcp.json must not contain tokens")

          env = Path("servers/harvest-rest/.env.example").read_text()
          for line in env.splitlines():
              if line.startswith("HARVEST_ACCESS_TOKEN=") and line.split("=", 1)[1].strip():
                  raise SystemExit(".env.example must leave HARVEST_ACCESS_TOKEN empty")
              if line.startswith("HARVEST_ACCOUNT_ID=") and line.split("=", 1)[1].strip():
                  raise SystemExit(".env.example must leave HARVEST_ACCOUNT_ID empty")

          # Runbooks + skills: same secret/account-ID checks, plus no live person names / exact rates.
          docs = [Path("servers/harvest-rest/COS-RUNBOOK.md")]
          docs.extend(sorted(Path("skills").glob("*/SKILL.md")))
          live_name = re.compile(r"\b(Chad|Arabella)\b")
          live_rate = re.compile(r"amount(?:`)? is \*\*145\*\*", re.I)
          # Real-looking assignments only; placeholders like "…" or empty are allowed.
          token_assign = re.compile(r'HARVEST_ACCESS_TOKEN\s*=\s*["\']?[A-Za-z0-9_-]{16,}')
          account_assign = re.compile(r'HARVEST_ACCOUNT_ID\s*=\s*["\']?\d{4,}')
          for path in docs:
              text = path.read_text()
              if token_assign.search(text):
                  raise SystemExit(f"{path} must not assign a live HARVEST_ACCESS_TOKEN")
              if account_assign.search(text):
                  raise SystemExit(f"{path} must not contain a live HARVEST_ACCOUNT_ID")
              if re.search(r"access_token\s*[:=]\s*['\"][A-Za-z0-9_-]{16,}", text, re.I):
                  raise SystemExit(f"{path} must not contain an access_token value")
              if live_name.search(text):
                  raise SystemExit(f"{path} must not contain live Harvest person names")
              if live_rate.search(text):
                  raise SystemExit(f"{path} must not contain live exact rates")
          print("mcp.json, .env.example, runbooks, and skills are public-safe")
          PY
