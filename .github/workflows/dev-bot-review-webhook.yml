# Push bridge: CodeRabbit / Bugbot → Dev Grok Bot webhook
# Cursor Automations intentionally drops bot/GitHub App comments; this Action
# re-emits them as a webhook so Dev is notified without polling.
#
# Repo secrets (already set on this repo):
#   DEV_BOT_REVIEW_WEBHOOK_URL
#   DEV_BOT_REVIEW_WEBHOOK_KEY
name: Dev bot-review webhook

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions: {}

jobs:
  notify-dev:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
        contains(fromJSON('["coderabbitai[bot]","cursor[bot]","cursoragent"]'), github.event.review.user.login)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["coderabbitai[bot]","cursor[bot]","cursoragent"]'), github.event.comment.user.login)) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(fromJSON('["coderabbitai[bot]","cursor[bot]","cursoragent"]'), github.event.comment.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST to Dev webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEV_BOT_REVIEW_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.DEV_BOT_REVIEW_WEBHOOK_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          # Untrusted review/comment fields: env + jq --arg/--argjson only (never ${{ }} in run:)
          REVIEW_ACTOR: ${{ toJSON(github.event.review.user.login) }}
          COMMENT_ACTOR: ${{ toJSON(github.event.comment.user.login) }}
          PR_NUMBER: ${{ toJSON(github.event.pull_request.number) }}
          ISSUE_NUMBER: ${{ toJSON(github.event.issue.number) }}
          REVIEW_STATE: ${{ toJSON(github.event.review.state) }}
          REVIEW_URL: ${{ toJSON(github.event.review.html_url) }}
          COMMENT_URL: ${{ toJSON(github.event.comment.html_url) }}
          COMMENT_PATH: ${{ toJSON(github.event.comment.path) }}
        run: |
          set -euo pipefail
          if [[ -z "${WEBHOOK_URL:-}" || -z "${WEBHOOK_KEY:-}" ]]; then
            echo "Missing DEV_BOT_REVIEW_WEBHOOK_URL or DEV_BOT_REVIEW_WEBHOOK_KEY"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BODY=$(jq -n --arg repo "$REPO" '{action:"ignore",repo:$repo,probe:true}')
          elif [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            BODY=$(jq -n \
              --arg repo "$REPO" \
              --arg event_name "$EVENT_NAME" \
              --argjson actor "${REVIEW_ACTOR:-null}" \
              --argjson pr "${PR_NUMBER:-null}" \
              --argjson review_state "${REVIEW_STATE:-null}" \
              --argjson comment_url "${REVIEW_URL:-null}" \
              '{action:"bot_review",repo:$repo,event_name:$event_name,actor:$actor,pr:$pr,review_state:$review_state,comment_url:$comment_url}')
          elif [[ "$EVENT_NAME" == "pull_request_review_comment" ]]; then
            BODY=$(jq -n \
              --arg repo "$REPO" \
              --arg event_name "$EVENT_NAME" \
              --argjson actor "${COMMENT_ACTOR:-null}" \
              --argjson pr "${PR_NUMBER:-null}" \
              --argjson comment_url "${COMMENT_URL:-null}" \
              --argjson path "${COMMENT_PATH:-null}" \
              '{action:"bot_review",repo:$repo,event_name:$event_name,actor:$actor,pr:$pr,comment_url:$comment_url,path:$path}')
          else
            BODY=$(jq -n \
              --arg repo "$REPO" \
              --arg event_name "$EVENT_NAME" \
              --argjson actor "${COMMENT_ACTOR:-null}" \
              --argjson pr "${ISSUE_NUMBER:-null}" \
              --argjson comment_url "${COMMENT_URL:-null}" \
              '{action:"bot_review",repo:$repo,event_name:$event_name,actor:$actor,pr:$pr,comment_url:$comment_url}')
          fi

          # No -L: do not follow redirects (would leak the webhook key).
          http_code=$(curl -sS -m 8 -o /tmp/webhook-resp -w "%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $WEBHOOK_KEY" \
            -H "X-Automation-Key: $WEBHOOK_KEY" \
            -d "$BODY")
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Webhook POST failed with HTTP $http_code"
            exit 1
          fi
          echo "Posted OK (HTTP $http_code)"
